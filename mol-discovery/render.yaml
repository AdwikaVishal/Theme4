services:
  - type: web
    name: mol-discovery-backend
    runtime: python
    rootDir: mol-discovery/backend
    buildCommand: pip install --upgrade pip && pip install "numpy==1.26.4" "pandas==2.1.4" && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: PORT
        value: 10000
